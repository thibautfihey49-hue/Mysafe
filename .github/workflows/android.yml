name: Build MySafe APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Get Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          # ✅ Télécharge DIRECTEMENT le jar — PAS BESOIN DE TOUT DECOMPRESSER
          curl -L "https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          ls -lh gradle/wrapper/
          
      - name: Make gradlew executable
        run: chmod +x gradlew
        
      - name: Build APK
        run: ./gradlew assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mysafe-apk
          path: app/build/outputs/apk/debug/app-debug.apk
